# =====================================================================
#  Publicar una versión de Visual App
# =====================================================================
#  Se dispara al subir una etiqueta de versión:
#
#    git tag v3.0.3
#    git push origin v3.0.3
#
#  y en una máquina Windows de GitHub:
#
#    1. comprueba que la etiqueta coincida con la versión de package.json,
#    2. instala las dependencias,
#    3. corre los tipos y las pruebas (si algo falla, no se publica nada),
#    4. arma el instalador con electron-builder, sin subir nada,
#    5. crea la publicación en Manota14-cpu/visual-app-descargas con el
#       instalador, el blockmap y latest.yml, en un solo paso.
#
#  Con eso, los programas instalados ven la versión nueva solos.
#
#  El código vive acá; las descargas, en visual-app-descargas, que es
#  público y no tiene código. Así este repositorio puede ser privado sin
#  cortar las actualizaciones.
#
#  Publicar en otro repositorio necesita una clave: el GITHUB_TOKEN de cada
#  ejecución solo sirve para este. Es el secreto DESCARGAS_TOKEN (ver README →
#  "Publicar una versión"). Los secretos de la firma de código son opcionales:
#  si no están cargados, el instalador sale sin firmar.
# =====================================================================

name: Publicar versión

on:
  push:
    tags: ["v*.*.*"]

# Lo mínimo: crear la publicación de este repositorio mientras sea público
# (ver el último paso).
permissions:
  contents: write

# Dos etiquetas seguidas no publican a la vez.
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DESCARGAS: Manota14-cpu/visual-app-descargas

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: La etiqueta coincide con package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta es $GITHUB_REF_NAME pero package.json dice $version. Cambiá la versión en package.json, o borrá la etiqueta y creala de nuevo."
            exit 1
          fi

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      - name: Armar el instalador
        run: npm run dist
        env:
          # Firma de código (opcional). Ver README → "Firmar el instalador".
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: El programa busca las actualizaciones en visual-app-descargas
        shell: bash
        run: |
          # Si esto no dice visual-app-descargas, los programas instalados
          # quedarían mirando otro lado. Mejor frenar acá que descubrirlo después.
          grep -q "repo: visual-app-descargas" dist/win-unpacked/resources/app-update.yml || {
            echo "::error::app-update.yml no apunta a visual-app-descargas:"; cat dist/win-unpacked/resources/app-update.yml; exit 1; }

      - name: Publicar en visual-app-descargas
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DESCARGAS_TOKEN }}
          PRIVADO: ${{ github.event.repository.private }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            if [ "$PRIVADO" = "true" ]; then
              echo "::error::Falta el secreto DESCARGAS_TOKEN. Sin él la versión no le llega a nadie: este repositorio es privado."
              exit 1
            fi
            echo "::warning::Falta el secreto DESCARGAS_TOKEN: no se publicó en $DESCARGAS. Mientras este repositorio sea público, la versión sale igual por acá."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/Visual-App-Setup.exe dist/Visual-App-Setup.exe.blockmap dist/latest.yml \
            --repo "$DESCARGAS" --title "Visual App ${GITHUB_REF_NAME#v}" \
            --notes-file build/release-notes.md

      # Las computadoras con la 3.0.2 o anterior buscan las actualizaciones
      # acá. Mientras este repositorio sea público se publica también acá, así
      # pasan a la versión nueva, que ya mira visual-app-descargas. Cuando pase
      # a privado este paso deja de correr solo: ya no le serviría a nadie.
      - name: Publicar también acá, para las versiones anteriores
        if: ${{ !github.event.repository.private }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Visual-App-Setup.exe dist/Visual-App-Setup.exe.blockmap dist/latest.yml \
            --repo "$GITHUB_REPOSITORY" --title "${GITHUB_REF_NAME#v}" \
            --notes-file build/release-notes.md
